# GolfReelz Pi capture agent — per-device config.
# Copy this file to config.yaml and edit the values for THIS Pi.
# The auth_token determines whether this device runs tee-side
# (person detection + recording) or green-side (long-poll + recording)
# logic — the backend tells us at the first heartbeat.

# ---------------------------------------------------------------------
# Backend connection
# ---------------------------------------------------------------------

backend_url: "https://your-deployment.replit.dev"

# The auth_token visible on /admin/cameras for this device. Can also
# be supplied via the GOLFREELZ_AUTH_TOKEN env var (overrides this
# file value) so you don't have to commit it to the SD card.
auth_token: "cam_REPLACE_ME"

# ---------------------------------------------------------------------
# Camera source
# ---------------------------------------------------------------------

camera:
  # "auto" tries /dev/video0..3 and picks the first that opens. Or
  # specify a device path like "/dev/video0" or an integer index "0".
  device: "auto"
  # OPTIONAL capture-mode preset (Pi HQ Cam / IMX477). Overrides
  # width/height/fps below. Higher fps = ~2x tracer points and less
  # motion blur on the ball; costs bigger uploads + more RAM for the
  # pre-roll buffer (5s of 1080p50 ~= 1.6GB, 990p120 ~= 2.4GB — fine
  # on an 8GB Pi 5). The tee ROI is auto-scaled to the new geometry.
  #   1080p30  — 1920x1080@30, the long-standing default
  #   720p50   — 1280x720@50, the 50fps mode the encoder can sustain
  #   1080p50  — 1920x1080@50, only on a COOL (unthrottled) Pi: the
  #              software encoder tops out near 31 fps at 1080p when
  #              throttled, and frames past that are lost
  #   990p120  — 1280x960@120, cropped, for high-speed experiments
  # At 50fps consider raising upload_bitrate_kbps (tee: ~5000) so
  # per-frame quality doesn't drop.
  # mode: "1080p50"
  # Capture resolution. GoPro Hero 13 USB-webcam mode is 1080p30.
  # Pi HQ Cam supports up to 4056x3040 but a Pi 5 will struggle at
  # full res; 1080p30 is the sweet spot for either camera.
  width: 1920
  height: 1080
  fps: 30

# ---------------------------------------------------------------------
# Tee-side ONLY: where in the camera's frame the "tee box" lives.
# Pixel coords in the captured frame (origin top-left). Find them by:
#   1. ssh into the Pi
#   2. python3 -c "import cv2; cap=cv2.VideoCapture(0); ok,f=cap.read(); cv2.imwrite('frame.jpg',f)"
#   3. open frame.jpg locally, draw a rectangle around the tee
#      markers in your image editor, note the pixel coords.
# Green cameras can leave this commented out.
# ---------------------------------------------------------------------

tee_box_roi:
  x: 600
  y: 400
  w: 700
  h: 500

# ---------------------------------------------------------------------
# Detection (tee-side only)
# ---------------------------------------------------------------------

detection:
  # How often to run the person detector (Hz). Lower = less CPU.
  # 5 fps is plenty for "is a person standing there for >=2 s".
  fps: 5
  # Person must be inside the ROI for this many seconds before we
  # consider it a real address-position (filters cart drive-bys).
  trigger_dwell_seconds: 2
  # After the trigger, keep recording until no person is seen for
  # this many seconds, then stop. This is the "group window": a golfer
  # bending to tee up, turning away, or stepping aside briefly makes the
  # person detector drop out for a few seconds, so keep this generous
  # (~30s) or one presence gets split into several short clips. Matches
  # the doc's "record the group, stop after ~30s of an empty tee box".
  no_person_timeout_seconds: 30
  # Frame is downsampled to this width before the pose model sees it.
  # Smaller = faster but less reliable at distance. 320 px works
  # well for a person at ~5-15 m.
  detect_width: 320

# ---------------------------------------------------------------------
# Buffers / recording
# ---------------------------------------------------------------------

# How many seconds of pre-roll to keep in RAM. The trigger commits
# this buffer first so the address frame and backswing are captured.
buffer_seconds: 5

# HOW LONG A CLIP IS. Not a runaway guard any more — on the tee this is
# hit routinely, and that is the point.
#
# A session used to run until the tee box emptied, which on a par-3 with
# a group waiting meant 143 s, 175 s, 215 s clips. At ~1500 kbps that is
# 27-40 MB, and a course uplink cannot move that inside the 180 s upload
# write timeout, so none of them ever arrived. 30 s is ~5.5 MB, which
# does. A waiting group now yields a series of 30 s clips that each make
# it, instead of one long one that does not — and one swing per clip is
# what the tracer wants anyway.
#
# The split keeps the pre-roll buffer, so consecutive clips OVERLAP by
# buffer_seconds and a swing landing on a boundary is still complete in
# one of them. Raise it if your uplink is good; lower it if 30 s clips
# still fail to upload.
#
# GREEN side: leave this ABOVE the tee's value. The green stops when the
# tee signals it, so its cap is only a backstop for a lost signal.
# Code defaults if unset: tee 30, green 45.
max_clip_seconds: 30

# RUNAWAY GUARD. A length-cap split means "the person is still in the
# ROI", and with a loose ROI that stays true forever — someone on the
# fairway or the cart path holds it open and the tee records 30s clips
# back to back with no end. Each costs ~23s to compress and ~10s to
# upload on a Pi also capturing at 50fps, so the queue only grows.
#
# After this many consecutive splits the automatic trigger pauses for
# split_cooldown_seconds. An operator Capture still gets through.
#
# If you see the warning it fires, the real fix is tee_box_roi: a full
# 1280x720 ROI triggers on anyone anywhere in shot. Draw it around the
# tee box.
max_consecutive_splits: 4
split_cooldown_seconds: 90

# Green-side only: how often to ask the backend whether the tee has
# signalled end-of-session. Lower = green stops closer to the tee but
# more HTTP traffic. 1 s is a good balance.
stop_poll_interval_seconds: 1.0

# Re-encode each clip to H.264 at this bitrate (kbps) before upload.
# Two wins: (1) clips play in any browser — the raw mp4v the camera
# writes won't play in desktop Chrome; (2) far smaller/faster to send on
# a cellular SIM (a ~100 MB mp4v clip -> ~10 MB). Set to 0 to disable.
# Code defaults differ by role if this is unset: the GREEN uses ~2.5
# Mbps (cosmetic landing view), the TEE uses ~5 Mbps (its footage feeds
# the ball tracer and needs more detail). Optionally downscale with
# upload_scale_height (e.g. 720); leave unset to keep capture res.
upload_bitrate_kbps: 2500
# upload_scale_height: 720

# Clips whose upload fails are kept here (under work_dir/pending) and
# retried whenever the uploader is idle, instead of being deleted. These
# bound it so a long outage cannot fill the SD card — oldest out first.
# upload_spool_max_mb: 2048
# upload_spool_max_age_hours: 24

# HOW LONG ONE UPLOAD ATTEMPT MAY TAKE, in seconds. A course link can sit
# dead for minutes and then run at full speed; a 6.3 MB clip needing only
# 289 kbps sustained still died, because every attempt happened to sit in
# a dead window for its whole duration. A longer attempt is simply still
# in progress when the link returns.
#
# Patience costs the queue, though, so it is spent where it is free:
#   fresh_timeout   a new clip with others waiting behind it. Short —
#                   if it misses, it is spooled and nothing is lost.
#   idle_timeout    a new clip with nothing behind it.
#   patient_timeout a spool retry. The worker is idle by definition here,
#                   so a long wait costs nothing at all.
# upload_fresh_timeout: 120
# upload_idle_timeout: 240
# upload_patient_timeout: 300
# (patient_timeout is multiplied by 5 when chunked upload is on -- see
#  below: a long chunked attempt banks progress instead of wasting it.)

# RESUMABLE UPLOAD. The tee's uplink is a USB cellular modem that reboots
# itself roughly every 30 seconds under load: dmesg shows it alive ~23s
# at ~125 KB/s, then gone ~8s while it re-enumerates on the USB bus
# (interface index reached 82 in one afternoon). A 6.5 MB clip needs
# ~52s of live wire, so it CANNOT finish inside one of those windows --
# every whole-file POST spent its timeout in a dead window and discarded
# everything it had already sent. The clip that failed thirty times was
# never too big for the link; it was too big for the link's uptime.
#
# With this on, a clip goes up in ~512 KB slices and the server banks the
# progress, so a reset costs one slice rather than the whole clip and the
# next window resumes where the last stopped. Progress also survives the
# agent restarting. Turn it off only to fall back to whole-file POSTs.
# upload_chunked: true
# upload_chunk_kb: 512

# BACK OFF WHEN UPLOADS ARE FAILING. Measured at Snee Farm: with both
# agents retrying back-to-back the uplink managed 4.8 KB/s; with them
# stopped, 162 KB/s -- same link, same minute, 35x. The retries were
# starving the transfers they existed to complete, and it could not
# recover on its own because nothing ever let the link go idle.
#
# After a failure the uploader goes quiet for backoff_base seconds,
# doubling each consecutive failure up to backoff_max, and attempts
# NOTHING during that window -- clips recorded meanwhile are compressed
# and spooled without a try. One success clears it.
# upload_backoff_base: 20
# upload_backoff_max: 600

# ONE THING AT A TIME. Observed on the course: a single golfer coming
# through with nothing else happening uploaded fine, while the same Pi
# triggering, recording, compressing and uploading at once could not
# move a 3.1 MB clip needing 212 kbps — on a link that had just measured
# 1300 kbps idle.
#
# So the uploader stands completely down while a capture is running, and
# for this many seconds after it ends. Clips recorded meanwhile are
# compressed and spooled, not sent, and go up in the next quiet stretch.
# Raise it if the Pi still struggles; lower it if clips sit too long.
#
# GREEN: leave this LONGER than the tee's. Both Pis record the same event
# and stop within a second of each other, so an equal settle wakes them
# into the same window and they upload simultaneously — a fix for
# contention turned into a metronome for it. Code defaults: tee 120,
# green 240, so the tee's clip (the one the tracer needs) goes first.
# upload_settle_seconds: 120

# ---------------------------------------------------------------------
# Audio (both sides)
# ---------------------------------------------------------------------
# Captured in parallel with each recording via `arecord` (alsa-utils)
# and muxed into the MP4 with ffmpeg before upload. Best-effort: if
# arecord isn't installed or the device can't be opened, the agent
# falls back to silent video.

audio:
  enabled: true
  # ALSA capture device. Leave unset (or set to null) to auto-detect:
  # the agent looks in /proc/asound/cards for a GoPro / HERO / UVC /
  # USB-Audio card and picks the first match. Hardcode if you have
  # multiple USB audio devices and auto-detect picks the wrong one:
  #   device: "plughw:CARD=HERO13Black"
  # List candidates with:
  #   arecord -L
  device: null
  sample_rate: 44100
  channels: 1   # mono is plenty for swing impact + ambience

# ---------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------

# Heartbeat cadence (s). Backend's offline alert watches last_seen_at.
heartbeat_seconds: 60

# Long-poll timeout for the green Pi waiting for a trigger. Below
# typical LTE / Replit-proxy idle timeouts (~30 s).
poll_timeout_seconds: 25

# ---------------------------------------------------------------------
# Battery telemetry (INA226 on I2C) — battery-powered deployments
# ---------------------------------------------------------------------
# An INA226 breakout wired inline on the 12V feed reports voltage +
# current draw on every heartbeat; the admin Cameras page shows a
# battery badge and warns before the battery dies. Harmless to leave
# enabled with no sensor attached (silently skipped).
# One-time Pi setup:  sudo raspi-config nonint do_i2c 0

battery:
  enabled: true
  i2c_bus: 1
  i2c_address: 0x40
  # Shunt resistance of YOUR board. The screw-terminal "0-36V 20A"
  # breakout is 0.002; the small blue CJMCU-226 board is 0.1.
  # Bench-check against a known load before trusting current numbers.
  shunt_ohms: 0.002

# ---------------------------------------------------------------------
# Curfew sleep/wake — battery-powered deployments
# ---------------------------------------------------------------------
# Halt the Pi outside playing hours and wake it by RTC alarm. Sleeping
# the dark hours roughly DOUBLES battery life (100Ah: ~5-6 days -> ~10-12),
# and battery swaps at night cost zero footage. Requires the RTC coin
# cell on the Pi 5's BAT connector. Times are the Pi's LOCAL time.
# Safety: won't halt on an unsynced clock; boot_grace_seconds keeps a
# freshly-booted Pi awake long enough to SSH in and disable this.

curfew:
  enabled: false          # flip to true on battery-powered rigs
  sleep: "21:00"
  wake: "06:00"
  boot_grace_seconds: 600
  # dry_run: true         # log what would happen, never power off

# ---------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------

# Local working directory for in-flight recordings. Default /tmp is
# fine for a Pi with tmpfs; if you want recordings to survive a
# reboot mid-upload, point this at a writable SD-card path.
work_dir: "/tmp/golfreelz-agent"

# Log verbosity. INFO covers normal operation; DEBUG is loud.
log_level: "INFO"
