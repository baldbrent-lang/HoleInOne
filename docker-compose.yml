services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parone
      POSTGRES_PASSWORD: parone
      POSTGRES_DB: parone
    ports:
      - "5432:5432"
    volumes:
      - parone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parone"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://parone:parone@db:5432/parone
      APP_BASE_URL: http://localhost:5173
      ADMIN_API_KEY: dev-admin-key
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  parone_pgdata:
