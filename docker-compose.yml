services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: golfreelz
      POSTGRES_PASSWORD: golfreelz
      POSTGRES_DB: golfreelz
    ports:
      - "5432:5432"
    volumes:
      - golfreelz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golfreelz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://golfreelz:golfreelz@db:5432/golfreelz
      APP_BASE_URL: http://localhost:5173
      ADMIN_PASSWORD: holeinone123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  golfreelz_pgdata:
